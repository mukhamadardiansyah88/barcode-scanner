<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Neon Scanner</title>
<link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/11414/11414183.png">
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/11414/11414183.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Rajdhani', 'Segoe UI', system-ui, sans-serif;
    background: #0a0a14;
    color: #e0e0ff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background:
      radial-gradient(circle at 20% 30%, rgba(138, 43, 226, 0.15) 0%, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(0, 200, 255, 0.12) 0%, transparent 40%);
    animation: floatBg 15s ease-in-out infinite;
    z-index: 0;
  }

  @keyframes floatBg {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(-5%, -5%); }
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .header {
    text-align: center;
    margin-bottom: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .app-icon {
    width: 72px;
    height: 72px;
    object-fit: contain;
    filter:
      drop-shadow(0 0 10px rgba(0, 229, 255, 0.7))
      drop-shadow(0 0 20px rgba(177, 74, 255, 0.5));
    animation: iconPulse 3s ease-in-out infinite;
    margin-bottom: 4px;
  }

  @keyframes iconPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }

  .title {
    font-size: 34px;
    font-weight: 700;
    letter-spacing: 3px;
    background: linear-gradient(90deg, #00e5ff, #b14aff, #ff2ea6, #00e5ff);
    background-size: 300% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shine 4s linear infinite;
    text-transform: uppercase;
    line-height: 1;
  }

  @keyframes shine {
    to { background-position: 300% center; }
  }

  .subtitle {
    font-size: 13px;
    color: #b8b8d8;
    margin-top: 2px;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: 600;
    text-shadow: 0 0 8px rgba(184, 184, 216, 0.3);
  }

  .scanner-wrapper {
    position: relative;
    width: 100%;
    border-radius: 20px;
    padding: 3px;
    background: linear-gradient(135deg, #00e5ff, #b14aff, #ff2ea6, #00e5ff);
    background-size: 300% 300%;
    animation: borderGlow 4s ease infinite;
    box-shadow:
      0 0 20px rgba(0, 229, 255, 0.4),
      0 0 40px rgba(177, 74, 255, 0.3),
      inset 0 0 20px rgba(0, 229, 255, 0.1);
    transition: opacity 0.3s ease, transform 0.3s ease;
  }

  @keyframes borderGlow {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  .scanner-wrapper.hidden { display: none; }

  .scanner-inner {
    background: #0a0a14;
    border-radius: 17px;
    overflow: hidden;
    position: relative;
  }

  #qr-reader { width: 100%; border: none !important; }

  #qr-reader video {
    border-radius: 17px !important;
    display: block !important;
    width: 100% !important;
    height: auto !important;
  }

  #qr-reader__scan_region { background: #0a0a14 !important; }
  #qr-reader__dashboard { display: none !important; }
  #qr-reader__header_message { display: none !important; }
  #qr-reader img[alt="Info icon"] { display: none !important; }

  .scan-line {
    position: absolute;
    left: 10%; right: 10%;
    height: 2px;
    background: linear-gradient(90deg, transparent, #00e5ff, #b14aff, #00e5ff, transparent);
    box-shadow: 0 0 15px #00e5ff, 0 0 30px #b14aff;
    animation: scanMove 2.5s ease-in-out infinite;
    pointer-events: none;
    z-index: 5;
    border-radius: 2px;
  }

  @keyframes scanMove {
    0%, 100% { top: 10%; opacity: 0.4; }
    50% { top: 88%; opacity: 1; }
  }

  .corner {
    position: absolute;
    width: 30px; height: 30px;
    border: 3px solid #00e5ff;
    z-index: 6;
    pointer-events: none;
    filter: drop-shadow(0 0 6px #00e5ff);
  }
  .corner.tl { top: 12px; left: 12px; border-right: none; border-bottom: none; border-radius: 12px 0 0 0; }
  .corner.tr { top: 12px; right: 12px; border-left: none; border-bottom: none; border-radius: 0 12px 0 0; }
  .corner.bl { bottom: 12px; left: 12px; border-right: none; border-top: none; border-radius: 0 0 0 12px; }
  .corner.br { bottom: 12px; right: 12px; border-left: none; border-top: none; border-radius: 0 0 12px 0; }

  .status {
    margin-top: 20px;
    font-size: 16px;
    color: #c8c8e8;
    text-align: center;
    letter-spacing: 1.2px;
    min-height: 22px;
    transition: all 0.3s;
    font-weight: 600;
    text-shadow: 0 0 8px rgba(200, 200, 232, 0.35);
  }

  .status.success {
    font-size: 20px;
    color: #00ff9d;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-shadow:
      0 0 10px rgba(0, 255, 157, 0.9),
      0 0 25px rgba(0, 255, 157, 0.6),
      0 0 40px rgba(0, 255, 157, 0.3);
    animation: successPop 0.4s ease;
  }

  @keyframes successPop {
    0% { transform: scale(0.85); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .loader {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid rgba(0, 229, 255, 0.3);
    border-top-color: #00e5ff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-right: 8px;
    vertical-align: middle;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .result-frame {
    display: none;
    width: 100%;
    padding: 3px;
    border-radius: 20px;
    background: linear-gradient(135deg, #00ff9d, #00e5ff, #b14aff, #00ff9d);
    background-size: 300% 300%;
    animation: borderGlow 4s ease infinite, popIn 0.4s ease;
    box-shadow:
      0 0 25px rgba(0, 255, 157, 0.5),
      0 0 50px rgba(0, 229, 255, 0.3);
  }

  .result-frame.show { display: block; }

  @keyframes popIn {
    0% { transform: scale(0.85); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .result-inner {
    background: #0a0a14;
    border-radius: 17px;
    padding: 30px 20px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .result-inner::before {
    content: '';
    position: absolute;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: radial-gradient(circle, rgba(0, 255, 157, 0.15) 0%, transparent 60%);
    animation: floatBg 8s ease-in-out infinite;
    pointer-events: none;
  }

  .check-icon {
    width: 60px; height: 60px;
    margin: 0 auto 15px;
    border-radius: 50%;
    background: rgba(0, 255, 157, 0.12);
    border: 2px solid #00ff9d;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 20px rgba(0, 255, 157, 0.5);
    position: relative;
    z-index: 1;
  }

  .check-icon svg {
    width: 32px; height: 32px;
    stroke: #00ff9d;
    stroke-width: 3.5;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    filter: drop-shadow(0 0 6px #00ff9d);
  }

  .result-label {
    font-size: 13px;
    letter-spacing: 3px;
    color: #00ff9d;
    text-transform: uppercase;
    margin-bottom: 12px;
    font-weight: 600;
    position: relative;
    z-index: 1;
  }

  .result-value {
    font-family: 'Rajdhani', 'SF Mono', 'Consolas', monospace;
    font-size: 44px;
    font-weight: 700;
    color: #00ff9d;
    text-shadow:
      0 0 12px rgba(0, 255, 157, 0.9),
      0 0 25px rgba(0, 255, 157, 0.5);
    word-break: break-all;
    line-height: 1.15;
    letter-spacing: 1px;
    position: relative;
    z-index: 1;
  }

  .footer-wrap {
    margin-top: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
  }

  .footer-line {
    flex: 1;
    height: 2px;
    max-width: 60px;
    border-radius: 2px;
    background: linear-gradient(90deg, transparent, #00e5ff, #b14aff, transparent);
    box-shadow: 0 0 8px rgba(0, 229, 255, 0.6);
  }

  .footer-line.right {
    background: linear-gradient(90deg, transparent, #ff2ea6, #00e5ff, transparent);
    box-shadow: 0 0 8px rgba(255, 46, 166, 0.6);
  }

  .footer {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1.8px;
    text-transform: uppercase;
    white-space: nowrap;
    background: linear-gradient(90deg, #00e5ff, #b14aff, #ff2ea6, #00e5ff);
    background-size: 300% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shine 4s linear infinite;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="https://cdn-icons-png.flaticon.com/512/11414/11414183.png" alt="Scanner Icon" class="app-icon">
      <div class="title">Neon Scanner</div>
      <div class="subtitle">Pembaca BARCODE & QR CODE</div>
    </div>

    <div class="scanner-wrapper" id="scannerWrapper">
      <div class="scanner-inner">
        <div id="qr-reader"></div>
        <div class="scan-line"></div>
        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>
      </div>
    </div>

    <div class="result-frame" id="resultFrame">
      <div class="result-inner">
        <div class="check-icon">
          <svg viewBox="0 0 24 24"><polyline points="4 12 10 18 20 6"/></svg>
        </div>
        <div class="result-label">Hasil Scan</div>
        <div class="result-value" id="resultValue">—</div>
      </div>
    </div>

    <div class="status" id="status">
      <span class="loader"></span>Menyiapkan kamera...
    </div>

    <div class="footer-wrap">
      <div class="footer-line"></div>
      <div class="footer">
        Powered By Mukhamad Ardiansyah · <span id="year"></span>
      </div>
      <div class="footer-line right"></div>
    </div>
  </div>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    // ============================================================
    // URL deployment /exec GAS Anda — sudah diisi
    // ============================================================
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzMgotAMK8mLqR9-8z7K0BKVRP0czDU7jUMis2PuplwhL_muk9zfG_RMfaLzwGC-gxt/exec';
    // ============================================================

    // Baca ?session= dari URL
    const params = new URLSearchParams(window.location.search);
    const sessionId = params.get('session');

    const statusEl = document.getElementById('status');
    const scannerWrapper = document.getElementById('scannerWrapper');
    const resultFrame = document.getElementById('resultFrame');
    const resultValue = document.getElementById('resultValue');

    function setStatus(text, isSuccess) {
      statusEl.className = 'status' + (isSuccess ? ' success' : '');
      statusEl.innerHTML = text;
    }

    window.addEventListener('touchstart', function wakeVibrate() {
      try { navigator.vibrate && navigator.vibrate(1); } catch (e) {}
      window.removeEventListener('touchstart', wakeVibrate);
    }, { once: true });

    function playBeep() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(1200, ctx.currentTime);
        osc.frequency.setValueAtTime(1800, ctx.currentTime + 0.06);
        gain.gain.setValueAtTime(0.0001, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.9, ctx.currentTime + 0.005);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.28);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.3);
        osc.onended = () => ctx.close();
      } catch (e) {}
    }

    function vibrateStrong() {
      if (navigator.vibrate) {
        navigator.vibrate([300, 100, 300, 100, 500, 200, 100, 300]);
      }
    }

    // ==== Kirim hasil ke server GAS via fetch GET (no-cors) ====
    async function kirimKeServer(barcode) {
      // Fallback: kalau tidak ada session, pakai postMessage (mode lama/standalone)
      if (!sessionId) {
        try { if (window.opener) window.opener.postMessage(barcode, '*'); } catch (e) {}
        try { window.parent.postMessage(barcode, '*'); } catch (e) {}
        setTimeout(() => { try { window.close(); } catch (e) {} }, 300);
        return;
      }

      try {
        const url = WEB_APP_URL + '?action=submit&session=' +
          encodeURIComponent(sessionId) + '&barcode=' + encodeURIComponent(barcode);
        await fetch(url, { method: 'GET', mode: 'no-cors' });
        // mode 'no-cors': respons tidak bisa dibaca, tapi server tetap menerima request
        console.log('Terkirim ke server:', barcode);
      } catch (e) {
        console.error('Gagal kirim ke server:', e);
      }

      // Tampilkan "Terkirim" sebentar sebelum tutup
      setStatus('✓ Terkirim', true);

      // Tutup tab setelah 800ms biar user lihat feedback
      setTimeout(() => { try { window.close(); } catch (e) {} }, 800);
    }

    function onScanSuccess(decodedText) {
      // Kunci: cegah scan kedua trigger
      scanner.pause(true);

      // Efek feedback
      playBeep();
      vibrateStrong();

      // Sembunyikan scanner, tampilkan hasil
      scannerWrapper.classList.add('hidden');
      resultValue.textContent = decodedText;
      resultFrame.classList.add('show');
      setStatus('✓ Berhasil Dipindai', true);

      // Delay 1.4 detik biar user lihat hasil, lalu kirim ke server
      setTimeout(() => {
        kirimKeServer(decodedText);
      }, 1400);
    }

    function onScanError() { /* silent */ }

    const config = {
      fps: 20,
      aspectRatio: 1.0,
      disableFlip: false,
      experimentalFeatures: {
        useBarCodeDetectorIfSupported: true
      },
      formatsToSupport: [
        Html5QrcodeSupportedFormats.QR_CODE,
        Html5QrcodeSupportedFormats.CODE_128,
        Html5QrcodeSupportedFormats.CODE_39,
        Html5QrcodeSupportedFormats.CODE_93,
        Html5QrcodeSupportedFormats.CODABAR,
        Html5QrcodeSupportedFormats.EAN_13,
        Html5QrcodeSupportedFormats.EAN_8,
        Html5QrcodeSupportedFormats.ITF,
        Html5QrcodeSupportedFormats.UPC_A,
        Html5QrcodeSupportedFormats.UPC_E,
        Html5QrcodeSupportedFormats.DATA_MATRIX,
        Html5QrcodeSupportedFormats.PDF_417
      ]
    };

    const scanner = new Html5Qrcode("qr-reader", {
      verbose: false,
      formatsToSupport: config.formatsToSupport,
      experimentalFeatures: config.experimentalFeatures
    });

    async function getCameraCount() {
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return -1;
        const devices = await navigator.mediaDevices.enumerateDevices();
        return devices.filter(d => d.kind === 'videoinput').length;
      } catch (e) {
        return -1;
      }
    }

    async function startScanner() {
      const count = await getCameraCount();

      if (count === 0) {
        setStatus('⚠ Device ini tidak memiliki kamera');
        return;
      }

      // Laptop (1 kamera) atau tidak bisa enumerasi: coba "user" dulu
      if (count === 1 || count === -1) {
        try {
          await scanner.start(
            { facingMode: "user" },
            config,
            onScanSuccess,
            onScanError
          );
          setStatus('Arahkan ke barcode / QR code');
          return;
        } catch (e) {
          try {
            await scanner.start(
              { facingMode: "environment" },
              config,
              onScanSuccess,
              onScanError
            );
            setStatus('Arahkan ke barcode / QR code');
            return;
          } catch (e2) {
            setStatus('⚠ Kamera tidak bisa diakses');
            return;
          }
        }
      }

      // HP (≥2 kamera): pakai kamera belakang
      try {
        await scanner.start(
          { facingMode: { exact: "environment" } },
          config,
          onScanSuccess,
          onScanError
        );
        setStatus('Arahkan ke barcode / QR code');
      } catch (e) {
        try {
          await scanner.start(
            { facingMode: "environment" },
            config,
            onScanSuccess,
            onScanError
          );
          setStatus('Arahkan ke barcode / QR code');
        } catch (e2) {
          setStatus('⚠ Kamera tidak bisa diakses: ' + e2.message);
        }
      }
    }

    startScanner();
  </script>
</body>
</html>
