<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Neon Scanner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Rajdhani', 'Segoe UI', system-ui, sans-serif;
    background: #0a0a14;
    color: #e0e0ff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background:
      radial-gradient(circle at 20% 30%, rgba(138, 43, 226, 0.15) 0%, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(0, 200, 255, 0.12) 0%, transparent 40%);
    animation: floatBg 15s ease-in-out infinite;
    z-index: 0;
  }

  @keyframes floatBg {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(-5%, -5%); }
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .header {
    text-align: center;
    margin-bottom: 20px;
  }

  .title {
    font-size: 34px;
    font-weight: 700;
    letter-spacing: 3px;
    background: linear-gradient(90deg, #00e5ff, #b14aff, #ff2ea6, #00e5ff);
    background-size: 300% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shine 4s linear infinite;
    text-transform: uppercase;
  }

  @keyframes shine {
    to { background-position: 300% center; }
  }

  .subtitle {
    font-size: 13px;
    color: #6a6a8a;
    margin-top: 4px;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: 500;
  }

  /* ==== SCANNER FRAME ==== */
  .scanner-wrapper {
    position: relative;
    width: 100%;
    border-radius: 20px;
    padding: 3px;
    background: linear-gradient(135deg, #00e5ff, #b14aff, #ff2ea6, #00e5ff);
    background-size: 300% 300%;
    animation: borderGlow 4s ease infinite;
    box-shadow:
      0 0 20px rgba(0, 229, 255, 0.4),
      0 0 40px rgba(177, 74, 255, 0.3),
      inset 0 0 20px rgba(0, 229, 255, 0.1);
    transition: opacity 0.3s ease, transform 0.3s ease;
  }

  @keyframes borderGlow {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  .scanner-wrapper.hidden {
    display: none;
  }

  .scanner-inner {
    background: #0a0a14;
    border-radius: 17px;
    overflow: hidden;
    position: relative;
  }

  #qr-reader { width: 100%; border: none !important; }

  #qr-reader video {
    border-radius: 17px !important;
    display: block !important;
    width: 100% !important;
    height: auto !important;
  }

  #qr-reader__scan_region { background: #0a0a14 !important; }
  #qr-reader__dashboard { display: none !important; }
  #qr-reader__header_message { display: none !important; }
  #qr-reader img[alt="Info icon"] { display: none !important; }

  .scan-line {
    position: absolute;
    left: 10%; right: 10%;
    height: 2px;
    background: linear-gradient(90deg, transparent, #00e5ff, #b14aff, #00e5ff, transparent);
    box-shadow: 0 0 15px #00e5ff, 0 0 30px #b14aff;
    animation: scanMove 2.5s ease-in-out infinite;
    pointer-events: none;
    z-index: 5;
    border-radius: 2px;
  }

  @keyframes scanMove {
    0%, 100% { top: 10%; opacity: 0.4; }
    50% { top: 88%; opacity: 1; }
  }

  .corner {
    position: absolute;
    width: 30px; height: 30px;
    border: 3px solid #00e5ff;
    z-index: 6;
    pointer-events: none;
    filter: drop-shadow(0 0 6px #00e5ff);
  }
  .corner.tl { top: 12px; left: 12px; border-right: none; border-bottom: none; border-radius: 12px 0 0 0; }
  .corner.tr { top: 12px; right: 12px; border-left: none; border-bottom: none; border-radius: 0 12px 0 0; }
  .corner.bl { bottom: 12px; left: 12px; border-right: none; border-top: none; border-radius: 0 0 0 12px; }
  .corner.br { bottom: 12px; right: 12px; border-left: none; border-top: none; border-radius: 0 0 12px 0; }

  /* ==== STATUS ==== */
  .status {
    margin-top: 20px;
    font-size: 15px;
    color: #8a8ab0;
    text-align: center;
    letter-spacing: 1px;
    min-height: 20px;
    transition: all 0.3s;
    font-weight: 500;
  }

  .loader {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid rgba(0, 229, 255, 0.3);
    border-top-color: #00e5ff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-right: 8px;
    vertical-align: middle;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* ==== HASIL SCAN — FRAME PENUH ==== */
  .result-frame {
    display: none;
    width: 100%;
    padding: 3px;
    border-radius: 20px;
    background: linear-gradient(135deg, #00ff9d, #00e5ff, #b14aff, #00ff9d);
    background-size: 300% 300%;
    animation: borderGlow 4s ease infinite, popIn 0.4s ease;
    box-shadow:
      0 0 25px rgba(0, 255, 157, 0.5),
      0 0 50px rgba(0, 229, 255, 0.3);
  }

  .result-frame.show { display: block; }

  @keyframes popIn {
    0% { transform: scale(0.85); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .result-inner {
    background: #0a0a14;
    border-radius: 17px;
    padding: 30px 20px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .result-inner::before {
    content: '';
    position: absolute;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: radial-gradient(circle, rgba(0, 255, 157, 0.15) 0%, transparent 60%);
    animation: floatBg 8s ease-in-out infinite;
    pointer-events: none;
  }

  .check-icon {
    width: 60px; height: 60px;
    margin: 0 auto 15px;
    border-radius: 50%;
    background: rgba(0, 255, 157, 0.12);
    border: 2px solid #00ff9d;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 20px rgba(0, 255, 157, 0.5);
    position: relative;
    z-index: 1;
  }

  .check-icon svg {
    width: 32px; height: 32px;
    stroke: #00ff9d;
    stroke-width: 3.5;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    filter: drop-shadow(0 0 6px #00ff9d);
  }

  .result-label {
    font-size: 13px;
    letter-spacing: 3px;
    color: #00ff9d;
    text-transform: uppercase;
    margin-bottom: 12px;
    font-weight: 600;
    position: relative;
    z-index: 1;
  }

  .result-value {
    font-family: 'Rajdhani', 'SF Mono', 'Consolas', monospace;
    font-size: 44px;
    font-weight: 700;
    color: #00ff9d;
    text-shadow:
      0 0 12px rgba(0, 255, 157, 0.9),
      0 0 25px rgba(0, 255, 157, 0.5);
    word-break: break-all;
    line-height: 1.15;
    letter-spacing: 1px;
    position: relative;
    z-index: 1;
  }

  /* ==== FOOTER ==== */
  .footer-wrap {
    margin-top: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
  }

  .footer-line {
    flex: 1;
    height: 2px;
    max-width: 60px;
    border-radius: 2px;
    background: linear-gradient(90deg, transparent, #00e5ff, #b14aff, transparent);
    box-shadow: 0 0 8px rgba(0, 229, 255, 0.6);
  }

  .footer-line.right {
    background: linear-gradient(90deg, transparent, #ff2ea6, #00e5ff, transparent);
    box-shadow: 0 0 8px rgba(255, 46, 166, 0.6);
  }

  .footer {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1.8px;
    text-transform: uppercase;
    white-space: nowrap;
    background: linear-gradient(90deg, #00e5ff, #b14aff, #ff2ea6, #00e5ff);
    background-size: 300% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shine 4s linear infinite;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title">Neon Scanner</div>
      <div class="subtitle">Barcode & QR Code Reader</div>
    </div>

    <!-- FRAME SCANNER -->
    <div class="scanner-wrapper" id="scannerWrapper">
      <div class="scanner-inner">
        <div id="qr-reader"></div>
        <div class="scan-line"></div>
        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>
      </div>
    </div>

    <!-- FRAME HASIL (muncul setelah scan) -->
    <div class="result-frame" id="resultFrame">
      <div class="result-inner">
        <div class="check-icon">
          <svg viewBox="0 0 24 24"><polyline points="4 12 10 18 20 6"/></svg>
        </div>
        <div class="result-label">Hasil Scan</div>
        <div class="result-value" id="resultValue">—</div>
      </div>
    </div>

    <div class="status" id="status">
      <span class="loader"></span>Menyiapkan kamera...
    </div>

    <div class="footer-wrap">
      <div class="footer-line"></div>
      <div class="footer">
        Powered By Mukhamad Ardiansyah · <span id="year"></span>
      </div>
      <div class="footer-line right"></div>
    </div>
  </div>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    const statusEl = document.getElementById('status');
    const scannerWrapper = document.getElementById('scannerWrapper');
    const resultFrame = document.getElementById('resultFrame');
    const resultValue = document.getElementById('resultValue');

    function setStatus(text) {
      statusEl.innerHTML = text;
    }

    // ==== BUNYI BEEP KENCANG (sekali) ====
    // Dual-tone: 1200Hz → 1800Hz, volume tinggi, tebal
    function playBeep() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioCtx();

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'square';  // square = lebih kencang & tegas dari sine
        osc.frequency.setValueAtTime(1200, ctx.currentTime);
        osc.frequency.setValueAtTime(1800, ctx.currentTime + 0.06);

        // Volume penuh (0.9) biar kencang
        gain.gain.setValueAtTime(0.0001, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.9, ctx.currentTime + 0.005);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.28);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.3);
        osc.onended = () => ctx.close();
      } catch (e) {
        console.warn('Beep gagal:', e);
      }
    }

    // ==== GETAR KUAT (pola panjang) ====
    // Hanya jalan di Android. iOS tidak support.
    function vibrateStrong() {
      if (navigator.vibrate) {
        // pola: getar-jeda-getar-jeda-getar panjang
        navigator.vibrate([150, 60, 150, 60, 250]);
      }
    }

    function onScanSuccess(decodedText) {
      // Kunci: cegah scan kedua trigger
      scanner.pause(true);

      // Efek feedback
      playBeep();
      vibrateStrong();

      // Sembunyikan frame scanner, tampilkan frame hasil
      scannerWrapper.classList.add('hidden');
      resultValue.textContent = decodedText;
      resultFrame.classList.add('show');
      setStatus('✓ Berhasil dipindai');

      // Kirim balik ke jendela induk GAS
      try {
        if (window.opener && !window.opener.closed) {
          window.opener.postMessage(decodedText, '*');
        }
      } catch (e) {
        console.error('postMessage gagal:', e);
      }

      // Tutup jendela setelah user lihat hasilnya (1.4 detik biar jelas)
      setTimeout(() => {
        window.close();
      }, 1400);
    }

    function onScanError() { /* silent */ }

    const config = {
      fps: 20,
      aspectRatio: 1.0,
      disableFlip: false,
      experimentalFeatures: {
        useBarCodeDetectorIfSupported: true
      },
      formatsToSupport: [
        Html5QrcodeSupportedFormats.QR_CODE,
        Html5QrcodeSupportedFormats.CODE_128,
        Html5QrcodeSupportedFormats.CODE_39,
        Html5QrcodeSupportedFormats.CODE_93,
        Html5QrcodeSupportedFormats.CODABAR,
        Html5QrcodeSupportedFormats.EAN_13,
        Html5QrcodeSupportedFormats.EAN_8,
        Html5QrcodeSupportedFormats.ITF,
        Html5QrcodeSupportedFormats.UPC_A,
        Html5QrcodeSupportedFormats.UPC_E,
        Html5QrcodeSupportedFormats.DATA_MATRIX,
        Html5QrcodeSupportedFormats.PDF_417
      ],
      videoConstraints: {
        facingMode: { exact: "environment" },
        width: { ideal: 1280 },
        height: { ideal: 720 }
      }
    };

    const scanner = new Html5Qrcode("qr-reader", {
      verbose: false,
      formatsToSupport: config.formatsToSupport,
      experimentalFeatures: config.experimentalFeatures
    });

    scanner.start(
      { facingMode: { exact: "environment" } },
      config,
      onScanSuccess,
      onScanError
    ).then(() => {
      setStatus('Arahkan ke barcode / QR code');
    }).catch(err => {
      console.error('Kamera gagal:', err);
      scanner.start(
        { facingMode: "environment" },
        config,
        onScanSuccess,
        onScanError
      ).then(() => {
        setStatus('Arahkan ke barcode / QR code');
      }).catch(err2 => {
        setStatus('⚠ Kamera tidak bisa diakses: ' + err2.message);
      });
    });
  </script>
</body>
</html>
