<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Neon Scanner</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0a0a14;
    color: #e0e0ff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow: hidden;
    position: relative;
  }

  /* Background glow */
  body::before {
    content: '';
    position: fixed;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background:
      radial-gradient(circle at 20% 30%, rgba(138, 43, 226, 0.15) 0%, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(0, 200, 255, 0.12) 0%, transparent 40%);
    animation: floatBg 15s ease-in-out infinite;
    z-index: 0;
  }

  @keyframes floatBg {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(-5%, -5%); }
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .header {
    text-align: center;
    margin-bottom: 20px;
  }

  .title {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 2px;
    background: linear-gradient(90deg, #00e5ff, #b14aff, #00e5ff);
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shine 3s linear infinite;
    text-transform: uppercase;
  }

  @keyframes shine {
    to { background-position: 200% center; }
  }

  .subtitle {
    font-size: 12px;
    color: #6a6a8a;
    margin-top: 6px;
    letter-spacing: 1px;
  }

  /* Scanner frame */
  .scanner-wrapper {
    position: relative;
    width: 100%;
    border-radius: 20px;
    padding: 3px;
    background: linear-gradient(135deg, #00e5ff, #b14aff, #ff2ea6, #00e5ff);
    background-size: 300% 300%;
    animation: borderGlow 4s ease infinite;
    box-shadow:
      0 0 20px rgba(0, 229, 255, 0.4),
      0 0 40px rgba(177, 74, 255, 0.3),
      inset 0 0 20px rgba(0, 229, 255, 0.1);
  }

  @keyframes borderGlow {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  .scanner-inner {
    background: #0a0a14;
    border-radius: 17px;
    overflow: hidden;
    position: relative;
  }

  #qr-reader {
    width: 100%;
    border: none !important;
  }

  /* Override html5-qrcode default styles */
  #qr-reader video {
    border-radius: 17px !important;
    display: block !important;
    width: 100% !important;
    height: auto !important;
  }

  #qr-reader__scan_region {
    background: #0a0a14 !important;
  }

  #qr-reader__dashboard {
    display: none !important;
  }

  #qr-reader__header_message {
    display: none !important;
  }

  #qr-reader img[alt="Info icon"] {
    display: none !important;
  }

  /* Scan line animation */
  .scan-line {
    position: absolute;
    left: 10%;
    right: 10%;
    height: 2px;
    background: linear-gradient(90deg, transparent, #00e5ff, #b14aff, #00e5ff, transparent);
    box-shadow: 0 0 15px #00e5ff, 0 0 30px #b14aff;
    animation: scanMove 2.5s ease-in-out infinite;
    pointer-events: none;
    z-index: 5;
    border-radius: 2px;
  }

  @keyframes scanMove {
    0%, 100% { top: 10%; opacity: 0.4; }
    50% { top: 88%; opacity: 1; }
  }

  /* Corner brackets */
  .corner {
    position: absolute;
    width: 30px;
    height: 30px;
    border: 3px solid #00e5ff;
    z-index: 6;
    pointer-events: none;
    filter: drop-shadow(0 0 6px #00e5ff);
  }
  .corner.tl { top: 12px; left: 12px; border-right: none; border-bottom: none; border-radius: 12px 0 0 0; }
  .corner.tr { top: 12px; right: 12px; border-left: none; border-bottom: none; border-radius: 0 12px 0 0; }
  .corner.bl { bottom: 12px; left: 12px; border-right: none; border-top: none; border-radius: 0 0 0 12px; }
  .corner.br { bottom: 12px; right: 12px; border-left: none; border-top: none; border-radius: 0 0 12px 0; }

  .status {
    margin-top: 20px;
    font-size: 13px;
    color: #8a8ab0;
    text-align: center;
    letter-spacing: 0.5px;
    min-height: 20px;
    transition: all 0.3s;
  }

  .status.success {
    color: #00ff9d;
    text-shadow: 0 0 10px rgba(0, 255, 157, 0.6);
    font-weight: 600;
  }

  .status.error {
    color: #ff4d6d;
    text-shadow: 0 0 10px rgba(255, 77, 109, 0.6);
  }

  .loader {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid rgba(0, 229, 255, 0.3);
    border-top-color: #00e5ff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-right: 8px;
    vertical-align: middle;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .footer {
    margin-top: 16px;
    font-size: 10px;
    color: #3a3a5a;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title">Neon Scanner</div>
      <div class="subtitle">Barcode & QR Code Reader</div>
    </div>

    <div class="scanner-wrapper">
      <div class="scanner-inner">
        <div id="qr-reader"></div>
        <div class="scan-line"></div>
        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>
      </div>
    </div>

    <div class="status" id="status">
      <span class="loader"></span>Menyiapkan kamera...
    </div>

    <div class="footer">Powered by GAS × GitHub Pages</div>
  </div>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script>
    const statusEl = document.getElementById('status');

    function setStatus(text, type) {
      statusEl.className = 'status' + (type ? ' ' + type : '');
      statusEl.innerHTML = text;
    }

    function onScanSuccess(decodedText, decodedResult) {
      // Getar feedback di HP
      if (navigator.vibrate) navigator.vibrate(100);

      setStatus('✓ Berhasil: ' + decodedText, 'success');

      // Kirim balik ke jendela induk GAS
      try {
        if (window.opener && !window.opener.closed) {
          window.opener.postMessage(decodedText, '*');
        }
      } catch (e) {
        console.error('postMessage gagal:', e);
      }

      // Tutup jendela setelah delay singkat biar user lihat feedback
      setTimeout(() => {
        window.close();
      }, 700);
    }

    function onScanError(errorMessage) {
      // Silent — error frame-by-frame normal, jangan spam UI
    }

    // Konfigurasi scanner: full frame, fps tinggi, kamera belakang
    const config = {
      fps: 20,
      // qrbox tidak diset → full frame, lebih fleksibel untuk barcode 1D
      aspectRatio: 1.0,
      disableFlip: false,
      experimentalFeatures: {
        useBarCodeDetectorIfSupported: true  // pakai BarcodeDetector API native kalau ada (Android Chrome)
      },
      formatsToSupport: [
        Html5QrcodeSupportedFormats.QR_CODE,
        Html5QrcodeSupportedFormats.CODE_128,
        Html5QrcodeSupportedFormats.CODE_39,
        Html5QrcodeSupportedFormats.CODE_93,
        Html5QrcodeSupportedFormats.CODABAR,
        Html5QrcodeSupportedFormats.EAN_13,
        Html5QrcodeSupportedFormats.EAN_8,
        Html5QrcodeSupportedFormats.ITF,
        Html5QrcodeSupportedFormats.UPC_A,
        Html5QrcodeSupportedFormats.UPC_E,
        Html5QrcodeSupportedFormats.DATA_MATRIX,
        Html5QrcodeSupportedFormats.PDF_417
      ],
      videoConstraints: {
        facingMode: { exact: "environment" },  // paksa kamera belakang
        width: { ideal: 1280 },
        height: { ideal: 720 }
      }
    };

    const scanner = new Html5Qrcode("qr-reader", {
      verbose: false,
      formatsToSupport: config.formatsToSupport,
      experimentalFeatures: config.experimentalFeatures
    });

    // Mulai scan langsung ke kamera belakang
    scanner.start(
      { facingMode: { exact: "environment" } },
      config,
      onScanSuccess,
      onScanError
    ).then(() => {
      setStatus('Arahkan ke barcode / QR code');
    }).catch(err => {
      console.error('Kamera gagal:', err);
      // Fallback: kalau "exact" gagal (beberapa HP), coba tanpa exact
      scanner.start(
        { facingMode: "environment" },
        config,
        onScanSuccess,
        onScanError
      ).then(() => {
        setStatus('Arahkan ke barcode / QR code');
      }).catch(err2 => {
        setStatus('⚠ Kamera tidak bisa diakses: ' + err2.message, 'error');
      });
    });
  </script>
</body>
</html>
